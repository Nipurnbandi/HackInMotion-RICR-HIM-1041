# Render Blueprint — one Docker web service (API + built SPA) + PostgreSQL.
# Deploy: Render Dashboard → New → Blueprint → select this repo → Apply.
# Spec: https://render.com/docs/blueprint-spec

databases:
  - name: smartcity-db
    databaseName: smartcity
    user: smartcity
    plan: free # note: free Postgres is removed ~30 days after creation
    region: singapore

services:
  - type: web
    name: smartcity
    runtime: docker
    plan: free # free web services sleep after 15 min idle; first hit is slow
    region: singapore # must match the database region
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true # redeploy on every push to the default branch

    # Photo uploads land in /app/uploads. On the free plan the container
    # filesystem is ephemeral, so uploaded images are lost on restart or
    # redeploy — everything else lives in Postgres and survives. Upgrade the
    # service to Starter and uncomment this to make uploads persistent.
    # disk:
    #   name: smartcity-uploads
    #   mountPath: /app/uploads
    #   sizeGB: 1

    envVars:
      # Wired automatically from the database above — nothing to copy.
      - key: DATABASE_URL
        fromDatabase:
          name: smartcity-db
          property: connectionString

      # Render generates a strong random value on first deploy.
      - key: JWT_SECRET_KEY
        generateValue: true

      - key: APP_NAME
        value: SmartCity API
      - key: DEBUG
        value: "false"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

      # API and SPA share one origin, so no cross-origin requests occur.
      - key: CORS_ORIGINS
        value: ""

      - key: UPLOAD_DIR
        value: /app/uploads
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "5242880"

      # Department notification emails. "console" logs them (safe default);
      # switch to "email" and add SMTP_* variables to send for real.
      - key: NOTIFIER
        value: console

      # First administrator, created on startup if it doesn't exist yet.
      # Render prompts for these when you apply the blueprint — Render's free
      # tier has no shell, so this is how you get an admin account.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Optional — enables AI photo verification. Leave unset and photos are
      # simply marked UNVERIFIED; nothing else changes.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PHOTO_VERIFICATION_MODEL
        value: claude-opus-5
